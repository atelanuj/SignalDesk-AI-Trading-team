services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketdesk
      POSTGRES_USER: marketdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketdesk_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U marketdesk -d marketdesk']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://marketdesk:${POSTGRES_PASSWORD:-marketdesk_local_dev}@db:5432/marketdesk
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  worker:
    build: ./backend
    command: [python, -m, app.worker]
    environment: *backend_env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
